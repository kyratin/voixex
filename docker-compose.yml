services:
  backend:
    image: ${VOIP_BACKEND_IMAGE:-ghcr.io/kyratin/voip-backend:latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      UDP_HOST: 0.0.0.0
      UDP_PORT: 50010
      PUBLIC_UDP_HOST: ${PUBLIC_UDP_HOST:-localhost}
      TOKEN_SECRET: ${TOKEN_SECRET:-change-me-token-secret}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-change-me-superuser}
      DB_PATH: /data/voip.sqlite
      MEDIA_RATE_LIMIT_PER_SEC: ${MEDIA_RATE_LIMIT_PER_SEC:-100}
    ports:
      - "${BACKEND_HTTP_PORT:-18080}:8080"
      - "${BACKEND_UDP_PORT:-50010}:50010/udp"
    volumes:
      - voip_data:/data

volumes:
  voip_data:
