name: Build and release

# Push to `windows`: build the Android APK as a check.
# Tag `v*`: build the APK and the desktop installers and publish a GitHub release.
on:
  push:
    branches: [windows]
    paths: ["primer_front/**", "voice-client/**", "desktop-client/**", ".github/workflows/release.yml"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: primer_front/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          IFS=. read -r major minor patch <<< "${name%%-*}"
          code=$(( major * 10000 + minor * 100 + ${patch:-0} ))
          # Check builds (not tags) are never installed over a release: any positive code will do.
          [ "$code" -gt 0 ] || code=$GITHUB_RUN_NUMBER
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Web UI
        working-directory: primer_front
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voixex.keystore"
            echo "VOIXEX_KEYSTORE_FILE=$RUNNER_TEMP/voixex.keystore" >> "$GITHUB_ENV"
          fi
      - name: APK
        working-directory: primer_front/android
        env:
          VOIXEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VOIXEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOIXEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          props="-PvoixexVersionName=${{ steps.v.outputs.name }} -PvoixexVersionCode=${{ steps.v.outputs.code }}"
          if [ -n "$VOIXEX_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease $props
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Voixex-${{ steps.v.outputs.name }}-android.apk"
          else
            # No release key configured: debug-signed APK (installable, but updates need the same key).
            ./gradlew --no-daemon assembleDebug $props
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Voixex-${{ steps.v.outputs.name }}-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Voixex-*.apk

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: |
          (cd primer_front && npm ci)
          (cd voice-client && npm ci && npm run build)
          (cd desktop-client && npm ci)
      - name: Build installer
        working-directory: desktop-client
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop-client/release/*.exe
            desktop-client/release/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
